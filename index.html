<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e4e9f2">
<title>Present Perfect Quiz – عصام عمايري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --base:#e4e9f2;
  --light:#ffffff;
  --dark:#b9c2d6;
  --ink:#27304d;
  --soft:#6b7694;
  --accent:#5a67f2;
  --accent-2:#8f6bff;
  --good:#1fb37a;
  --bad:#ee5a6c;
  --gold:#f5b53d;
  --r-lg:28px;
  --r-md:20px;
  --r-sm:14px;
  --raise:9px 9px 20px var(--dark), -9px -9px 20px var(--light);
  --raise-sm:5px 5px 12px var(--dark), -5px -5px 12px var(--light);
  --press:inset 6px 6px 13px var(--dark), inset -6px -6px 13px var(--light);
  --press-sm:inset 3px 3px 7px var(--dark), inset -3px -3px 7px var(--light);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--base)}
body{
  min-height:100vh;min-height:100dvh;
  background:var(--base);
  color:var(--ink);
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-weight:700;
  line-height:1.45;
  padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
  display:flex;justify-content:center;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* ---------- watermark ---------- */
.wm{
  position:fixed;inset:-35%;z-index:50;pointer-events:none;user-select:none;
  display:flex;flex-wrap:wrap;gap:34px 46px;align-content:flex-start;justify-content:center;
  transform:rotate(-24deg);
}
.wm span{
  font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;font-weight:800;font-size:22px;
  color:rgba(39,48,77,.075);white-space:nowrap;
}
.signature{
  text-align:center;margin-top:26px;color:var(--soft);font-size:.95rem;
  font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;font-weight:600;
}
.signature b{color:var(--accent);font-weight:800}

/* ---------- layout ---------- */
.app{width:100%;max-width:560px;position:relative}
.screen{animation:in .35s ease both}
.hidden{display:none!important}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

h1,h2,h3,.display{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;line-height:1.1}

/* ---------- home ---------- */
.hero{
  background:var(--base);border-radius:var(--r-lg);box-shadow:var(--raise);
  padding:28px 22px 26px;text-align:center;margin-top:6px;
}
.hero .badge{
  width:92px;height:92px;margin:0 auto 16px;border-radius:50%;
  box-shadow:var(--press);display:grid;place-items:center;
}
.hero .badge i{
  width:62px;height:62px;border-radius:50%;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  box-shadow:4px 4px 10px rgba(90,103,242,.35),-3px -3px 8px var(--light);
  display:grid;place-items:center;color:#fff;font-style:normal;
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.35rem;
}
.hero h1{font-size:clamp(1.9rem,8vw,2.5rem);margin-bottom:8px}
.hero p{color:var(--soft);font-size:1.02rem;max-width:34ch;margin:0 auto}

.modes{display:grid;gap:18px;margin-top:24px}
.mode{
  text-align:left;background:var(--base);border-radius:var(--r-md);box-shadow:var(--raise-sm);
  padding:18px 18px;display:flex;align-items:center;gap:16px;transition:box-shadow .2s,transform .2s;
}
.mode:hover{transform:translateY(-1px)}
.mode:active{box-shadow:var(--press-sm);transform:none}
.mode .ico{
  flex:none;width:56px;height:56px;border-radius:18px;box-shadow:var(--press-sm);
  display:grid;place-items:center;font-size:1.6rem;
}
.mode h2{font-size:1.25rem;margin-bottom:2px}
.mode small{display:block;color:var(--soft);font-weight:700;font-size:.92rem}
.mode .count{
  margin-left:auto;flex:none;min-width:46px;text-align:center;padding:6px 10px;border-radius:12px;
  box-shadow:var(--press-sm);font-family:"Baloo 2",sans-serif;font-weight:800;color:var(--accent);
}

/* ---------- quiz ---------- */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.icon-btn{
  flex:none;width:46px;height:46px;border-radius:50%;box-shadow:var(--raise-sm);
  display:grid;place-items:center;font-size:1.2rem;background:var(--base);
}
.icon-btn:active{box-shadow:var(--press-sm)}
.progress-wrap{flex:1}
.progress-meta{display:flex;justify-content:space-between;font-size:.9rem;color:var(--soft);margin-bottom:6px}
.track{height:16px;border-radius:99px;box-shadow:var(--press-sm);padding:3px}
.fill{
  height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  box-shadow:2px 2px 5px rgba(90,103,242,.35);transition:width .4s ease;
}
.chips{display:flex;gap:12px;margin-bottom:18px}
.chip{
  flex:1;border-radius:var(--r-sm);box-shadow:var(--raise-sm);padding:9px 12px;
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:.95rem;
}
.chip b{font-family:"Baloo 2",sans-serif;font-size:1.2rem;color:var(--accent)}

.qcard{
  border-radius:var(--r-lg);box-shadow:var(--raise);padding:24px 20px 22px;
}
.qtag{
  display:inline-block;padding:5px 14px;border-radius:99px;box-shadow:var(--press-sm);
  font-size:.88rem;color:var(--soft);margin-bottom:14px;
}
.qtext{font-family:"Baloo 2","Nunito",sans-serif;font-weight:700;font-size:clamp(1.3rem,5.6vw,1.65rem);line-height:1.45;margin-bottom:22px}
.blank{
  display:inline-block;min-width:76px;padding:0 12px;margin:0 3px;border-radius:12px;
  box-shadow:var(--press-sm);color:var(--accent);text-align:center;vertical-align:baseline;
  transition:color .2s;
}
.blank.empty::after{content:"\00a0"}
.blank.right{color:var(--good)}
.blank.wrong{color:var(--bad)}

.options{display:grid;gap:14px}
.opt{
  display:flex;align-items:center;gap:14px;text-align:left;
  padding:13px 14px;border-radius:var(--r-md);background:var(--base);
  box-shadow:var(--raise-sm);font-size:1.08rem;transition:box-shadow .15s,transform .15s;
}
.opt:hover:not(:disabled){transform:translateY(-1px)}
.opt:active:not(:disabled){box-shadow:var(--press-sm);transform:none}
.opt .l{
  flex:none;width:38px;height:38px;border-radius:50%;box-shadow:var(--press-sm);
  display:grid;place-items:center;font-family:"Baloo 2",sans-serif;font-weight:800;color:var(--accent);
}
.opt:disabled{cursor:default}
.opt.right{box-shadow:var(--press);color:var(--good)}
.opt.right .l{background:var(--good);color:#fff;box-shadow:none}
.opt.wrong{box-shadow:var(--press);color:var(--bad);animation:shake .38s}
.opt.wrong .l{background:var(--bad);color:#fff;box-shadow:none}
.opt.dim{opacity:.55}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

.feedback{
  margin-top:20px;border-radius:var(--r-md);box-shadow:var(--press-sm);padding:14px 16px;
  font-size:1.02rem;min-height:0;
}
.feedback.good{color:var(--good)}
.feedback.bad{color:var(--bad)}
.feedback .sent{display:block;color:var(--ink);margin-top:4px;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.1rem}

.btn{
  display:block;width:100%;margin-top:20px;padding:15px 18px;border-radius:var(--r-md);
  font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.2rem;color:#fff;
  background:linear-gradient(145deg,var(--accent),var(--accent-2));
  box-shadow:6px 6px 14px rgba(90,103,242,.35),-5px -5px 12px var(--light);
  transition:transform .15s,box-shadow .15s;
}
.btn:active{transform:scale(.98);box-shadow:inset 3px 3px 8px rgba(0,0,0,.2)}
.btn.ghost{
  background:var(--base);color:var(--ink);box-shadow:var(--raise-sm);
}
.btn.ghost:active{box-shadow:var(--press-sm)}


.why{
  margin-top:14px;padding-top:12px;border-top:2px solid var(--dark);color:var(--ink);
  font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;font-weight:600;font-size:1rem;line-height:1.75;
  direction:rtl;text-align:right;
}
.why .wt{display:block;color:var(--accent);font-weight:800}
.why .oth{display:block;margin-top:6px;color:var(--soft);font-size:.95rem}
.why .oth b{color:var(--ink)}
.why .lat{direction:ltr;unicode-bidi:isolate}
.rev .why{margin-top:8px;padding-top:8px;font-size:.92rem}

/* ---------- result ---------- */
.result{border-radius:var(--r-lg);box-shadow:var(--raise);padding:28px 20px 24px;text-align:center}
.ring{
  --p:0;width:176px;height:176px;margin:4px auto 18px;border-radius:50%;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),transparent 0);
  box-shadow:var(--press);padding:12px;
}
.ring-in{
  width:100%;height:100%;border-radius:50%;background:var(--base);box-shadow:var(--raise-sm);
  display:grid;place-content:center;
}
.ring-in b{font-family:"Baloo 2",sans-serif;font-size:2.7rem;font-weight:800;line-height:1}
.ring-in span{color:var(--soft);font-size:.95rem}
.stars{display:flex;justify-content:center;gap:10px;margin-bottom:12px;font-size:1.9rem}
.stars i{font-style:normal;color:var(--dark);text-shadow:1px 1px 0 var(--light)}
.stars i.on{color:var(--gold);text-shadow:0 2px 6px rgba(245,181,61,.55)}
.result h2{font-size:1.8rem;margin-bottom:6px}
.result p{color:var(--soft)}

.review{margin-top:22px;text-align:left}
.review h3{font-size:1.2rem;margin-bottom:12px;text-align:center}
.rev{border-radius:var(--r-md);box-shadow:var(--press-sm);padding:12px 14px;margin-bottom:12px;font-size:.98rem}
.rev .you{color:var(--bad)}
.rev .ans{color:var(--good)}

@media (min-width:600px){
  body{padding-top:36px}
  .wm span{font-size:26px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="wm" id="wm" aria-hidden="true"></div>

<main class="app">

  <!-- HOME -->
  <section id="home" class="screen">
    <div class="hero">
      <div class="badge"><i>✓</i></div>
      <h1>English Quiz</h1>
      <p>Pick a challenge, tap the best answer and see your score at the end.</p>
    </div>
    <div class="modes">
      <button class="mode" data-mode="grammar">
        <span class="ico">📝</span>
        <span><h2>Correct Answer</h2><small>Present perfect</small></span>
        <span class="count">28</span>
      </button>
      <button class="mode" data-mode="meaning">
        <span class="ico">💡</span>
        <span><h2>Correct Meaning</h2><small>Words in context</small></span>
        <span class="count">6</span>
      </button>
      <button class="mode" data-mode="all">
        <span class="ico">🏆</span>
        <span><h2>Full Challenge</h2><small>Everything together</small></span>
        <span class="count">34</span>
      </button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="screen hidden">
    <div class="topbar">
      <button class="icon-btn" id="back" aria-label="Back to menu">←</button>
      <div class="progress-wrap">
        <div class="progress-meta"><span id="secName"></span><span id="pos"></span></div>
        <div class="track"><div class="fill" id="fill"></div></div>
      </div>
    </div>
    <div class="chips">
      <div class="chip">⭐ Score <b id="score">0</b></div>
      <div class="chip">🔥 Streak <b id="streak">0</b></div>
    </div>
    <article class="qcard">
      <span class="qtag" id="qtag"></span>
      <p class="qtext" id="qtext"></p>
      <div class="options" id="options"></div>
      <div class="feedback hidden" id="feedback" role="status" aria-live="polite"></div>
      <button class="btn hidden" id="next">Next question</button>
    </article>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen hidden">
    <div class="result">
      <div class="ring" id="ring"><div class="ring-in"><b id="rScore">0</b><span id="rOf">of 0</span></div></div>
      <div class="stars" id="stars"><i>★</i><i>★</i><i>★</i></div>
      <h2 id="rTitle"></h2>
      <p id="rMsg"></p>
      <button class="btn" id="again">Try again</button>
      <button class="btn ghost" id="retryWrong">Retry my mistakes</button>
      <button class="btn ghost" id="menu">Back to menu</button>
      <div class="review hidden" id="review"><h3>Review your mistakes</h3><div id="revList"></div></div>
    </div>
  </section>

  <p class="signature">تصميم وإعداد: <b>عصام عمايري</b></p>
</main>

<script>
/* ---------- data ( __ = blank ) ---------- */
const DATA = {
  grammar: { name: "Correct Answer", qs: [
    {t:"She has already __ this film.", o:["sees","saw","see","seen"], a:3,e:"already تدل على المضارع التام، والقاعدة: has/have + V3. التصريف: see – saw – seen، لذلك الصيغة الصحيحة seen.|sees (مضارع) و saw (ماضي) و see (مصدر) ليست V3."},
    {t:"Good news! They __ enough money for the charity.", o:["have raised","haven't raised","has raised","had raised"], a:0,e:"الخبر الجيد له نتيجة في الحاضر فنستخدم المضارع التام: have/has + V3. الفاعل They جمع فنقول have raised.|has لا تناسب They، و haven't تعاكس معنى الخبر السار، و had raised ماضي تام."},
    {t:"They __ a cure for the common cold yet.", o:["had discovered","are discovering","haven't discovered","discovers"], a:2,e:"yet تدل على المضارع التام، والجملة منفية والفاعل They، فنستخدم haven't + V3 = haven't discovered.|had/are/discovers لا تعبّر عن المضارع التام المنفي."},
    {t:"While I've been a volunteer, we __ helped a lot of young people.", o:["had","have","are","haven't"], a:1,e:"عبارة I've been تدل على المضارع التام، والفاعل we جمع فنستخدم have + V3 = have helped.|had ماضي تام، و are لا تأتي قبل V3 هنا، و haven't تعاكس المعنى (ساعدنا الكثيرين)."},
    {t:"They have __ several awards.", o:["won","wins","is winning","win"], a:0,e:"بعد have نستخدم V3. التصريف: win – won – won.|wins و win و is winning ليست V3."},
    {t:"She misses him, she __ him for a long time.", o:["haven't seen","has seen","hasn't seen","sees"], a:2,e:"for a long time تدل على المضارع التام، والمعنى: تشتاق له لأنها لم تره منذ مدة طويلة. الفاعل She فنستخدم hasn't + V3 = hasn't seen.|haven't لا تناسب She، و has seen تعاكس المعنى، و sees مضارع بسيط."},
    {t:"I __ my pen. I am unable to do my exercise.", o:["have loose","loses","have lost","has lost"], a:2,e:"فقدت القلم والنتيجة ظاهرة الآن (لا أستطيع الحل) فنستخدم have/has + V3. الفاعل I فنقول have lost، والتصريف: lose – lost – lost.|has لا تناسب I، و loses ليست V3، و loose صفة بمعنى فضفاض وليست فعلاً."},
    {t:"She's very experienced now. She __ a volunteer for two years.", o:["has been","hasn't been","haven't been","have been"], a:0,e:"for two years تدل على المضارع التام، والفاعل She فنستخدم has + V3. التصريف: be – was/were – been، فنقول has been.|have/haven't لا تناسب She، و hasn't been تنفي وتعاكس المعنى (هي ذات خبرة)."},
    {t:"I __ in this city since last year.", o:["am","has been","have been","were"], a:2,e:"since last year (منذ العام الماضي) تدل على المضارع التام، والفاعل I فنستخدم have + V3 = have been.|am و were لا تفيدان الاستمرار منذ نقطة زمنية، و has لا تناسب I."},
    {t:"He's hungry. He __ for four days.", o:["hasn't eaten","hasn't eat","eats","has ate"], a:0,e:"for four days تدل على المضارع التام، وهو جائع لأنه لم يأكل منذ أربعة أيام فنقول hasn't + V3. التصريف: eat – ate – eaten.|بعد hasn't لا نستخدم V1 (eat)، و has ate خطأ لأن ate هي V2، و eats مضارع بسيط."},
    {t:"I haven't __ sushi.", o:["am trying","try","tries","tried"], a:3,e:"بعد haven't نستخدم V3. التصريف: try – tried – tried.|am trying و try و tries ليست V3."},
    {t:"Have you __ your homework?", o:["did","do","done","does"], a:2,e:"السؤال في المضارع التام: Have + فاعل + V3. التصريف: do – did – done.|did هي V2، و do/does هي V1."},
    {t:"She __ just arrived.", o:["hasn't","has","haven't","have"], a:1,e:"just تدل على المضارع التام، والفاعل She فنستخدم has + just + V3.|have لا تناسب She، و hasn't/haven't نفي ولا يناسبان just في هذه الجملة."},
    {t:"Mr. Smith __ a teacher for nine years.", o:["has been","is been","haven't been","have been"], a:0,e:"for nine years تدل على المضارع التام، والفاعل Mr. Smith مفرد فنستخدم has + V3 = has been.|have لا تناسب المفرد، و is been خطأ لأن is لا تأتي قبل V3 هنا، و haven't نفي."},
    {t:"I haven't __ to Paris before.", o:["goes","been","went","gone"], a:1,e:"بعد haven't نستخدم V3. التصريف: be – was/were – been، وعبارة have been to تعني زار المكان ثم عاد (تجربة سابقة، before).|goes و went ليستا V3، و gone to تعني ذهب ولم يرجع بعد."},
    {t:"Thomas __ the driving test.", o:["have passed","hasn't passed","has passed","has passes"], a:2,e:"الفاعل Thomas مفرد فنستخدم has + V3 = has passed (نجح في الاختبار).|have لا تناسب المفرد، و has passes خطأ لأن بعد has نستخدم V3 لا مضارعاً بسيطاً، و hasn't passed صحيحة قواعدياً لكنها تعطي معنى النفي."},
    {t:"They __ the museum since 2014.", o:["haven't visited","hasn't visited","didn't visited","don't visited"], a:0,e:"since 2014 تدل على المضارع التام، والفاعل They جمع فنستخدم haven't + V3 = haven't visited.|hasn't لا تناسب They، و didn't/don't يأتي بعدهما V1 لا V3 (visited)."},
    {t:"She __ working there for three years.", o:["have been","been","be","has been"], a:3,e:"for three years مع المضارع التام المستمر: has/have + been + V-ing. الفاعل She فنقول has been.|have لا تناسب She، و been/be وحدهما لا تكفيان بدون has."},
    {t:"The accident hasn't __ any permanent damage.", o:["causes","caused","cause","causing"], a:1,e:"بعد hasn't نستخدم V3. التصريف: cause – caused – caused.|causes و cause و causing ليست V3."},
    {t:"He __ already __ to France.", o:["has/travels","hasn't/travelled","has/travelled","has/travel"], a:2,e:"already تأتي في الإثبات مع المضارع التام: has + already + V3. الفاعل He مفرد فنقول has travelled.|hasn't نفي ولا يناسب already، و travels/travel ليست V3."},
    {t:"I haven't heard anything from her __ a long time.", o:["since","just","for","yet"], a:2,e:"نستخدم for مع مدة زمنية (a long time)، بينما since تأتي مع نقطة بداية محددة مثل 2014.|since تحتاج نقطة بداية، و just و yet لا تأتيان قبل مدة زمنية."},
    {t:"We __ her since she arrived to our city.", o:["are knowing","have knew","know","have known"], a:3,e:"since she arrived تدل على المضارع التام: have + V3. التصريف: know – knew – known.|are knowing خطأ لأن know فعل حالة لا يأتي بصيغة الاستمرار، و knew هي V2، و know مضارع بسيط."},
    {t:"He __ here for two months.", o:["is working","was working","has worked","works"], a:2,e:"for two months تدل على المضارع التام، والفاعل He فنقول has + V3 = has worked.|is working و was working و works لا تعبّر عن مدة بدأت في الماضي وما زالت مستمرة."},
    {t:"__ Amer __ a car yet?", o:["Has/buy","Have/bought","Has/bought","Is/buying"], a:2,e:"yet في السؤال تدل على المضارع التام: Has + فاعل مفرد + V3. التصريف: buy – bought – bought.|Has/buy لا يوجد فيها V3، و Have لا تناسب Amer المفرد، و Is/buying ليست مضارعاً تاماً."},
    {t:"She __ the cat yet.", o:["hasn't fed","has feed","haven't fed","had fed"], a:0,e:"yet في النفي مع المضارع التام، والفاعل She فنستخدم hasn't + V3. التصريف: feed – fed – fed.|has feed خطأ لأن feed هي V1، و haven't لا تناسب She، و had fed ماضي تام."},
    {t:"I am not hungry. I __ already __.", o:["has/eaten","have/ate","haven't/eaten","have/eaten"], a:3,e:"لست جائعاً لأني أكلت بالفعل: already في الإثبات، والفاعل I فنقول have + already + V3 = have already eaten.|has لا تناسب I، و ate هي V2، و haven't نفي يعاكس already."},
    {t:"I __ breakfast yet.", o:["has/eaten","have/ate","haven't/eaten","have/eaten"], a:2,e:"yet تأتي في النفي، والفاعل I فنستخدم haven't + V3 = haven't eaten.|has لا تناسب I، و have eaten إثبات لا يناسب yet، و ate هي V2."},
    {t:"She has already __ this exercise.", o:["does","did","do","done"], a:3,e:"has already + V3. التصريف: do – did – done.|does و do هما V1، و did هي V2."}
  ]},
  meaning: { name: "Correct Meaning", qs: [
    {t:"Preparing for your exams is __.", o:["excited","stressed","stressing","depressed"], a:2,e:"نستخدم V-ing لوصف الشيء الذي يسبب الشعور، و V-ed لوصف الشخص الذي يشعر. التحضير للامتحانات هو الذي يسبب التوتر فنقول stressing.|stressed و depressed و excited تصف شعور الشخص لا الشيء."},
    {t:"Money is not __ for happiness.", o:["required","requires","requiring","require"], a:0,e:"الجملة مبنية للمجهول: is/are + V3. المعنى: المال ليس مطلوباً للسعادة = not required.|requires و require و requiring ليست V3."},
    {t:"Bus service is __ during storms.", o:["suspending","suspend","suspends","suspended"], a:3,e:"الجملة مبنية للمجهول: is + V3 = is suspended (الخدمة تُعلَّق، فهي لا تعلّق نفسها).|suspending و suspend و suspends ليست V3."},
    {t:"This party was done for the __ of the poor.", o:["misuse","frustration","benefit","worry"], a:2,e:"for the benefit of = لمصلحة / لفائدة. المعنى: أُقيمت الحفلة لصالح الفقراء.|misuse = سوء استخدام، frustration = إحباط، worry = قلق، ولا تناسب المعنى."},
    {t:"A lift was put to meet the disabled __.", o:["needs","wants","hobbies","dreams"], a:0,e:"meet the needs of = تلبية احتياجات. المعنى: وُضع مصعد لتلبية احتياجات ذوي الإعاقة.|wants و hobbies و dreams لا تُستخدم مع meet بهذا المعنى."},
    {t:"Some people in Africa do not have __ to safe drinking water.", o:["accessing","desire","glass","access"], a:3,e:"have access to = تتوفر لديهم إمكانية الوصول إلى. بعد have نحتاج اسماً (access) ثم to.|accessing فعل بصيغة ing، و desire = رغبة، و glass = كوب، ولا تناسب المعنى."}
  ]}
};
DATA.grammar.qs.forEach(q => q.s = "grammar");
DATA.meaning.qs.forEach(q => q.s = "meaning");

/* ---------- watermark ---------- */
(function(){
  const wm = document.getElementById("wm");
  const frag = document.createDocumentFragment();
  for(let i=0;i<260;i++){
    const s = document.createElement("span");
    s.textContent = "عصام عمايري";
    frag.appendChild(s);
  }
  wm.appendChild(frag);
})();

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const screens = ["home","quiz","result"];
function show(id){
  screens.forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo({top:0});
}
function fillText(q, optText){
  const parts = optText.split("/");
  const blanks = q.t.split("__").length - 1;
  let n = 0;
  return q.t.replace(/__/g, () => {
    const w = blanks === 1 ? parts.join(" ") : (parts[n++] || "");
    return w;
  });
}


/* keep English phrases in correct left-to-right order inside Arabic text */
function iso(str){
  return str.replace(/[A-Za-z0-9][A-Za-z0-9'’\/+\-–=.\s]*[A-Za-z0-9'’]|[A-Za-z0-9]/g, m => "\u2066" + m + "\u2069");
}
function whyBox(q){
  const [rule, others] = q.e.split("|").map(x => x && iso(x));
  const box = document.createElement("div");
  box.className = "why"; box.lang = "ar"; box.dir = "rtl";
  const t = document.createElement("span"); t.className = "wt"; t.textContent = "💡 لماذا هذه الإجابة؟";
  const r = document.createElement("span"); r.textContent = rule;
  box.append(t, r);
  if(others){
    const o = document.createElement("span"); o.className = "oth";
    const b = document.createElement("b"); b.textContent = "لماذا الخيارات الأخرى خاطئة؟ ";
    o.append(b, document.createTextNode(others));
    box.appendChild(o);
  }
  return box;
}

/* ---------- state ---------- */
let S = null;
const LETTERS = ["a","b","c","d"];

function start(list, label){
  S = { qs:list, i:0, score:0, streak:0, locked:false, wrong:[], label, mode:null };
  show("quiz");
  render();
}

function render(){
  const q = S.qs[S.i];
  S.locked = false;
  $("secName").textContent = S.label;
  $("pos").textContent = (S.i+1) + " / " + S.qs.length;
  $("fill").style.width = (S.i / S.qs.length * 100) + "%";
  $("score").textContent = S.score;
  $("streak").textContent = S.streak;
  $("qtag").textContent = "Question " + (S.i+1);

  // question text with blank(s)
  const box = $("qtext");
  box.textContent = "";
  const segs = q.t.split("__");
  segs.forEach((seg, k) => {
    box.appendChild(document.createTextNode(seg));
    if(k < segs.length - 1){
      const b = document.createElement("span");
      b.className = "blank empty";
      box.appendChild(b);
    }
  });

  // options
  const opts = $("options");
  opts.textContent = "";
  q.o.forEach((text, idx) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.type = "button";
    const l = document.createElement("span"); l.className = "l"; l.textContent = LETTERS[idx];
    const t = document.createElement("span"); t.textContent = text;
    b.append(l, t);
    b.addEventListener("click", () => pick(idx));
    opts.appendChild(b);
  });

  $("feedback").classList.add("hidden");
  $("next").classList.add("hidden");
}

function fillBlanks(q, text, cls){
  const blanks = [...$("qtext").querySelectorAll(".blank")];
  const parts = text.split("/");
  blanks.forEach((b, n) => {
    b.classList.remove("empty");
    b.classList.add(cls);
    b.textContent = blanks.length === 1 ? parts.join(" ") : (parts[n] || "");
  });
}

function pick(idx){
  if(S.locked) return;
  S.locked = true;
  const q = S.qs[S.i];
  const ok = idx === q.a;
  const btns = [...$("options").children];
  btns.forEach((b, k) => {
    b.disabled = true;
    if(k === q.a) b.classList.add("right");
    else if(k === idx) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  fillBlanks(q, q.o[idx], ok ? "right" : "wrong");

  const fb = $("feedback");
  fb.className = "feedback " + (ok ? "good" : "bad");
  if(ok){
    S.score++; S.streak++;
    const cheers = ["Great job!","Perfect!","You got it!","Well done!","Excellent!"];
    fb.textContent = cheers[(S.i + S.streak) % cheers.length] + (S.streak >= 3 ? "  " + S.streak + " in a row!" : "");
  } else {
    S.streak = 0;
    S.wrong.push({q, picked:idx});
    fb.textContent = "Not quite. The correct sentence is:";
    const s = document.createElement("span");
    s.className = "sent";
    s.textContent = fillText(q, q.o[q.a]);
    fb.appendChild(s);
  }
  fb.appendChild(whyBox(q));
  $("score").textContent = S.score;
  $("streak").textContent = S.streak;
  $("fill").style.width = ((S.i + 1) / S.qs.length * 100) + "%";

  const nx = $("next");
  nx.textContent = S.i === S.qs.length - 1 ? "See my result" : "Next question";
  nx.classList.remove("hidden");
  nx.focus({preventScroll:true});
  nx.scrollIntoView({behavior:"smooth", block:"nearest"});
}

function next(){
  if(S.i < S.qs.length - 1){ S.i++; render(); window.scrollTo({top:0,behavior:"smooth"}); }
  else finish();
}

function finish(){
  const total = S.qs.length;
  const pct = Math.round(S.score / total * 100);
  show("result");
  $("rScore").textContent = S.score;
  $("rOf").textContent = "out of " + total;
  $("ring").style.setProperty("--p", pct);
  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 40 ? 1 : 0;
  [...$("stars").children].forEach((s, k) => s.classList.toggle("on", k < stars));
  let title, msg;
  if(pct === 100){ title = "Perfect score!"; msg = "Not a single mistake. You really know your grammar."; }
  else if(pct >= 90){ title = "Brilliant!"; msg = "So close to perfect. Check the one or two you missed."; }
  else if(pct >= 70){ title = "Very good!"; msg = "You are doing well. Review your mistakes and try again."; }
  else if(pct >= 40){ title = "Good start!"; msg = "Keep practising. Every try makes you stronger."; }
  else { title = "Don't give up!"; msg = "Read the correct sentences below, then try again."; }
  $("rTitle").textContent = title;
  $("rMsg").textContent = pct + "% correct. " + msg;

  const rv = $("review"), list = $("revList");
  list.textContent = "";
  $("retryWrong").classList.toggle("hidden", S.wrong.length === 0);
  if(S.wrong.length){
    rv.classList.remove("hidden");
    S.wrong.forEach(w => {
      const d = document.createElement("div");
      d.className = "rev";
      const you = document.createElement("div");
      you.className = "you"; you.textContent = "✗ " + fillText(w.q, w.q.o[w.picked]);
      const ans = document.createElement("div");
      ans.className = "ans"; ans.textContent = "✓ " + fillText(w.q, w.q.o[w.q.a]);
      d.append(you, ans, whyBox(w.q));
      list.appendChild(d);
    });
  } else rv.classList.add("hidden");
}

/* ---------- events ---------- */
function listFor(mode){
  if(mode === "all") return {list:[...DATA.grammar.qs, ...DATA.meaning.qs], label:"Full Challenge"};
  return {list:[...DATA[mode].qs], label:DATA[mode].name};
}
document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => {
  const m = b.dataset.mode;
  const {list, label} = listFor(m);
  start(list, label);
  S.mode = m;
}));
$("next").addEventListener("click", next);
$("back").addEventListener("click", () => show("home"));
$("menu").addEventListener("click", () => show("home"));
$("again").addEventListener("click", () => {
  const m = S.mode, {list, label} = listFor(m);
  start(list, label); S.mode = m;
});
$("retryWrong").addEventListener("click", () => {
  const m = S.mode;
  start(S.wrong.map(w => w.q), "My mistakes"); S.mode = m;
});
</script>
